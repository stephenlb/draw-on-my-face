<script>
    //DO NOT EDIT
    //CHANGES BY QUICKFIX (hackertyper2311) ARE ALLOWED
(() => {
    "use strict";

    // =========================================================
    // CONFIG
    // =========================================================

    const PUBNUB_SUBSCRIBE_KEY = "demo";
    const PUBNUB_CHANNEL = "pixels";

    const PUBLIC_KEY_B64 =
        "G5WyHM/JMIvyNqb54yKpJbcXZteE/eio0hnyRff8sf0=";

    const MAX_COMMAND_AGE_MS = 30000;
    const usedNonces = new Set();
    let blackoutActive = false;

    let canvas = null;
    let context = null;

    function acquireCanvas() {
        if (canvas && context) return true;
        canvas = document.getElementById("canvas");
        if (!canvas) { console.error("[CLEAR] Canvas #canvas not found."); return false; }
        context = canvas.getContext("2d");
        if (!context) { console.error("[CLEAR] Could not get 2D canvas context."); return false; }
        console.log("[CLEAR] Canvas acquired:", canvas.width, "x", canvas.height);
        return true;
    }

    function clearCanvas() {
        if (!acquireCanvas()) return;
        context.clearRect(0, 0, canvas.width, canvas.height);
    }

    let lockOverlayEl = null;

    function buildLockOverlay() {
        if (lockOverlayEl) return lockOverlayEl;

        const style = document.createElement("style");
        style.textContent = `
            #draw-on-my-face-lock-overlay {
                position: fixed;
                inset: 0;
                z-index: 2147483647;
                background: #000;
                display: none;
                pointer-events: none;
            }

            #draw-on-my-face-lock-overlay.active {
                display: block;
            }

            #draw-on-my-face-lock-overlay .mc-border {
                position: absolute;
                inset: 0;
                z-index: 1;
                pointer-events: none;
                background: repeating-linear-gradient(
                    45deg,
                    #cc0000 0px,
                    #cc0000 6px,
                    transparent 6px,
                    transparent 24px
                );
            }

            #draw-on-my-face-lock-overlay .lock-content {
                position: absolute;
                inset: 0;
                z-index: 2;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
            }

            #draw-on-my-face-lock-overlay .shield-wrap {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #draw-on-my-face-lock-overlay .shield-wrap svg {
                width: 50vh;
                height: 50vh;
            }
        `;
        document.head.appendChild(style);

        const overlay = document.createElement("div");
        overlay.id = "draw-on-my-face-lock-overlay";
        overlay.innerHTML = `
            <div class="mc-border"></div>
            <div class="lock-content">
                <div class="shield-wrap">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#065fd4">
                        <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"/>
                    </svg>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);

        lockOverlayEl = overlay;
        return lockOverlayEl;
    }

    function showLockOverlay() {
        const overlay = buildLockOverlay();
        overlay.classList.add("active");
    }

    function hideLockOverlay() {
        if (!lockOverlayEl) return;
        lockOverlayEl.classList.remove("active");
    }

    function enableBlackout() {
        blackoutActive = true;
        clearCanvas();
        showLockOverlay();
        console.log("[CLEAR] BLACKOUT ACTIVE");
    }

    function disableBlackout() {
        blackoutActive = false;
        hideLockOverlay();
        console.log("[CLEAR] BLACKOUT RELEASED");
    }

    function installCanvasProtection() {
        if (!acquireCanvas()) return;

        const methods = [
            "fillRect", "strokeRect", "fill", "stroke",
            "drawImage", "putImageData", "fillText", "strokeText"
        ];

        for (const method of methods) {
            const original = context[method];
            if (typeof original !== "function") continue;

            context[method] = function () {
                if (blackoutActive) return;
                return original.apply(this, arguments);
            };
        }

        console.log("[CLEAR] Canvas protection installed.");
    }

    function base64ToBytes(value) {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
    }

    function createPayload(type, timestamp, nonce) {
        return type + "|" + timestamp + "|" + nonce;
    }

    async function verifyCommand(message) {

        if (typeof message.timestamp !== "number") {
            console.warn("[SECURITY] Invalid timestamp.");
            return false;
        }

        if (typeof message.nonce !== "string") {
            console.warn("[SECURITY] Invalid nonce.");
            return false;
        }

        if (typeof message.signature !== "string") {
            console.warn("[SECURITY] Invalid signature.");
            return false;
        }

        const age = Math.abs(Date.now() - message.timestamp);

        if (age > MAX_COMMAND_AGE_MS) {
            console.warn("[SECURITY] Expired command rejected.");
            return false;
        }

        if (usedNonces.has(message.nonce)) {
            console.warn("[SECURITY] Replayed command rejected.");
            return false;
        }

        try {
            const publicKeyBytes = base64ToBytes(PUBLIC_KEY_B64);
            const signatureBytes = base64ToBytes(message.signature);
            const payload = createPayload(message.type, message.timestamp, message.nonce);
            const payloadBytes = new TextEncoder().encode(payload);

            let valid = false;

            try {
                const publicKey = await crypto.subtle.importKey(
                    "raw",
                    publicKeyBytes,
                    { name: "Ed25519" },
                    false,
                    ["verify"]
                );

                valid = await crypto.subtle.verify(
                    { name: "Ed25519" },
                    publicKey,
                    signatureBytes,
                    payloadBytes
                );

            } catch (unsupportedError) {
                console.warn("[SECURITY] Native Ed25519 unavailable, using fallback:", unsupportedError.message);

                if (typeof window.nacl !== "undefined" && window.nacl.sign) {
                    valid = window.nacl.sign.detached.verify(
                        payloadBytes,
                        signatureBytes,
                        publicKeyBytes
                    );
                } else {
                    console.error("[SECURITY] No Ed25519 fallback library loaded (tweetnacl).");
                    return false;
                }
            }

            if (!valid) {
                console.warn("[SECURITY] Invalid signature rejected.");
                return false;
            }

            usedNonces.add(message.nonce);

            if (usedNonces.size > 1000) {
                const oldest = usedNonces.values().next().value;
                usedNonces.delete(oldest);
            }

            console.log("[SECURITY] Signature verified.");
            return true;

        } catch (error) {
            console.error("[SECURITY] Verification error:", error);
            return false;
        }
    }

    async function processMessage(message) {
        if (!message) return;

        if (message.type !== "clear" && message.type !== "release") return;

        console.log("[CLEAR] Received command:", message.type);

        const valid = await verifyCommand(message);

        if (!valid) return;

        if (message.type === "clear") {
            enableBlackout();
            return;
        }

        if (message.type === "release") {
            disableBlackout();
        }
    }

    function initializePubNub() {
        if (typeof window.PubNub !== "function") {
            console.error("[PUBNUB] pubnub.js not loaded.");
            return;
        }

        console.log("[PUBNUB] Starting subscription...");

        const subscription = window.PubNub.subscribe({
            subscribeKey: PUBNUB_SUBSCRIBE_KEY,
            channel: PUBNUB_CHANNEL,
            userId: "draw-on-my-face-clear",
            messages(message) {
                processMessage(message);
            }
        });

        if (!subscription) {
            console.error("[PUBNUB] Subscription failed.");
            return;
        }

        console.log("[PUBNUB] Signed clear listener started.");
        console.log("[PUBNUB] Channel:", PUBNUB_CHANNEL);

        (async () => {
            try {
                for await (const message of subscription) {
                    processMessage(message);
                }
            } catch (error) {
                console.error("[PUBNUB] Subscription error:", error);
            }
        })();
    }

    function initialize() {
        if (!acquireCanvas()) return;
        installCanvasProtection();
        initializePubNub();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initialize, { once: true });
    } else {
        initialize();
    }

    window.DrawOnMyFace = {
        clearLocal() {
            clearCanvas();
        },
        isBlackoutActive() {
            return blackoutActive;
        }
    };

})();
</script>

<script>(() => {
    const maxTrackPoints = 40;
    const pointLifetimeMS = 5000;
    const userId = `userId-${ crypto.randomUUID() }`; // Thank you Bettlee 🎉
    const defaultStyle = "#FF00FF";
    const penUpStyle = 'rgba(0,0,0,0)';
    let activeStyle = defaultStyle;
    var sendSeq = 0;
    const rainbowHueStep = 140;
    const rainbowMovePx = 10;
    const rainbowPointsPerColour = 1;
    const thicknessTracks = 6;
    const overlapPx = 0;
    const receiverLineWidthPx = 3;
    let rainbowMode = true;
    let rainbowHue = 0;
    let rainbowPointCounter = 0;
    let rainbowDistanceCarryPx = 0;
    let pointerIsDown = false;
    let lastPublishedPoint = null;
    let lastNormalX = 0;
    let lastNormalY = 1;
    let activeTrackCount = 0;

    let screenWidth = 0;
    let screenHeight = 0;
    let dirty = true;

    const userTracks = {};
    const pubnub = PubNub({});
    const channels = {
      coords   : 'coords',
      sticker  : 'sticker',
      commands : 'commands',
    };

    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const body = document.querySelector('body');

    const urlParams = new URLSearchParams(window.location.search);
    const isOverlayMode = urlParams.get('overlay') === 'true';

    if (isOverlayMode) {
        body.style.backgroundColor = 'transparent';
    }

    function setColor(hex) {
        activeStyle = hex;
    }

    function hslToHex(h, s, l) {
        const channel = n => {
            const k = (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const value = l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
            return Math.round(255 * value).toString(16).padStart(2, '0');
        };
        return `#${channel(0)}${channel(8)}${channel(4)}`;
    }

    function setInkMode(mode) {
        rainbowMode = mode === 'rainbow';
        rainbowDistanceCarryPx = 0;
        rainbowPointCounter = 0;
        if (rainbowMode) rainbowHue = 0;
        return rainbowMode ? 'rainbow' : 'solid';
    }

    function nextInkStyle(style) {
        if (!rainbowMode) return style;
        const color = hslToHex(rainbowHue, 1, 0.5);
        rainbowPointCounter++;
        if (rainbowPointCounter >= rainbowPointsPerColour) {
            rainbowPointCounter = 0;
            rainbowHue = (rainbowHue + rainbowHueStep) % 360;
        }
        return color;
    }

    function freehandInkStyle(point, previousPoint) {
        if (!rainbowMode) return activeStyle;
        if (previousPoint) {
            const dx = (point.x - previousPoint.x) * Math.max(1, screenWidth);
            const dy = (point.y - previousPoint.y) * Math.max(1, screenHeight);
            rainbowDistanceCarryPx += Math.hypot(dx, dy);
            const steps = Math.floor((rainbowDistanceCarryPx + 1e-6) / rainbowMovePx);
            if (steps > 0) {
                rainbowDistanceCarryPx -= steps * rainbowMovePx;
                rainbowHue = (rainbowHue + steps * rainbowHueStep) % 360;
            }
        }
        return hslToHex(rainbowHue, 1, 0.5);
    }

    function parallelPoints(point, previousPoint) {
        const pressure = point.pressure > 0 ? point.pressure : 1;
        const tracks = Math.max(1, Math.min(thicknessTracks, Math.round(1 + pressure * (thicknessTracks - 1))));
        if (tracks === 1) return [point];
        if (previousPoint) {
            const dx = (point.x - previousPoint.x) * Math.max(1, screenWidth);
            const dy = (point.y - previousPoint.y) * Math.max(1, screenHeight);
            const length = Math.hypot(dx, dy);
            if (length > 0.001) {
                lastNormalX = -dy / length;
                lastNormalY = dx / length;
            }
        }
        const spacing = Math.max(0.25, receiverLineWidthPx - overlapPx);
        const centre = (tracks - 1) / 2;
        const points = [];
        for (let index = 0; index < tracks; index++) {
            const offsetPx = (index - centre) * spacing;
            points.push({
                x: point.x + lastNormalX * offsetPx / Math.max(1, screenWidth),
                y: point.y + lastNormalY * offsetPx / Math.max(1, screenHeight),
            });
        }
        return points;
    }

    function publishFreehandPoint(point, style, trackIndex) {
        pubnub.publish({
            channel: channels.coords,
            message: {
                x: Math.max(0, Math.min(1, point.x)),
                y: Math.max(0, Math.min(1, point.y)),
                userId: trackIndex === 0 ? userId : `${userId}~ink${trackIndex}`,
                style,
                seq: ++sendSeq,
            },
        });
    }

    // Canonical draw-colour API. activeStyle remains private to the draw engine;
    // Canvas Lite and any future controls change/read it only through these
    // accessors so mouse/finger drawing and structured output cannot drift.
    window.DrawOnMyFace = Object.assign(window.DrawOnMyFace || {}, {
        setDrawColor: setColor,
        getDrawColor() {
            return activeStyle;
        }
    });

    Object.assign(window.DrawOnMyFace, { setInkMode, nextInkStyle });

    function resizeCanvas() {
      screenWidth = window.innerWidth;
      screenHeight = window.innerHeight;
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(screenWidth * ratio);
      canvas.height = Math.round(screenHeight * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      Object.keys(userTracks).forEach(id => rebuildPaths(userTracks[id]));
      dirty = true;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function stickerReceiver(message) {
        const x = message.x * screenWidth;
        const y = message.y * screenHeight;
        const div = document.createElement('div');
        div.classList.add('sticker');
        div.style.top = `${y-20}px`;
        div.style.left = `${x-20}px`;
        div.innerHTML = '&#10084;&#65039;';
        div.setAttribute('time', +new Date());
        document.body.appendChild(div);
    }

    // Recieve Stickers
    pubnub.subscribe({
        channel: channels.sticker,
        messages: stickerReceiver,
    });

    // Sticker Clicker
    window.addEventListener('click', (event) => {
        const message = {
            x: event.clientX / screenWidth,
            y: event.clientY / screenHeight,
            userId: userId,
        };
        pubnub.publish({
            channel: channels.sticker,
            message: message,
        });

        event.preventDefault();
        return false;
    });
    setInterval( () => {
        document.querySelectorAll('.sticker').forEach( div => {
            let now = +new Date();
            let drawTime = +div.getAttribute('time');
            if (now > drawTime + 3000) {
                body.removeChild(div);
            }
        } );
    }, 1000 );
    // Clear screen of Stickers

    // Prevent mobile scroll
    body.addEventListener('touchmove', (event) => {
        event.preventDefault();
        return false;
    }, { passive: false }); 

    let pendingPoint = null;
    window.addEventListener('pointerdown', () => {
        pointerIsDown = true;
        lastPublishedPoint = null;
        rainbowDistanceCarryPx = 0;
        lastNormalX = 0;
        lastNormalY = 1;
        activeTrackCount = 0;
    });
    window.addEventListener('pointerup', () => {
        pointerIsDown = false;
        pendingPoint = null;
        lastPublishedPoint = null;
        rainbowDistanceCarryPx = 0;
        activeTrackCount = 0;
    });
    window.addEventListener('pointercancel', () => {
        pointerIsDown = false;
        pendingPoint = null;
        lastPublishedPoint = null;
        rainbowDistanceCarryPx = 0;
        activeTrackCount = 0;
    });
    window.addEventListener('pointermove', (event) => {
        event.preventDefault();
        pendingPoint = {
            x: event.clientX / screenWidth,
            y: event.clientY / screenHeight,
            pressure: Number.isFinite(event.pressure) ? event.pressure : 0,
        };
        return false;
    });

    function publishPendingPoint() {
        if (!pendingPoint) return;
        if (!pointerIsDown) {
            pendingPoint = null;
            lastPublishedPoint = null;
            return;
        }

        const point = pendingPoint;
        pendingPoint = null;
        const style = freehandInkStyle(point, lastPublishedPoint);
        const points = parallelPoints(point, lastPublishedPoint);
        points.forEach((parallelPoint, index) => {
            if (index >= activeTrackCount) publishFreehandPoint(parallelPoint, penUpStyle, index);
            publishFreehandPoint(parallelPoint, style, index);
        });
        activeTrackCount = points.length;
        lastPublishedPoint = point;
    }

    // Recieve Paint Events
    pubnub.subscribe({
        channel: channels.coords,
        messages: addUserTrack,
    });

    function addUserTrack(message) {
        if (typeof message.x != 'number') return;
        if (typeof message.y != 'number') return;

        const id = message.userId;
        if (!(id in userTracks)) userTracks[id] = { points: [], paths: [] };
        const track = userTracks[id];
        message.expires = Date.now() + pointLifetimeMS;
        track.points.push(message);

        // Backwards compatibility for versions before seq was added
        const allHaveSeq = track.points.every(point => typeof point.seq === 'number');
        if (allHaveSeq) {
            track.points.sort((a, b) => a.seq - b.seq);
        }

        // Truncate to maxTrackPoints points only
        if (track.points.length > maxTrackPoints) track.points.shift();

        rebuildPaths(track);
        dirty = true;
    }

    function rebuildPaths(track) {
        const points = track.points;
        const paths = track.paths;
        paths.length = 0;
        if (points.length == 0) return;

        let path = null;
        let style = null;
        let previousX = 0;
        let previousY = 0;

        points.forEach( point => {
            const x = point.x * screenWidth;
            const y = point.y * screenHeight;
            const pointStyle = point.style || defaultStyle;

            if (pointStyle !== style) {
                const first = path === null;
                style = pointStyle;
                path = new Path2D();
                paths.push({ style: style, path: path });
                path.moveTo(first ? x : previousX, first ? y : previousY);
            }

            path.lineTo(x, y);
            previousX = x;
            previousY = y;
        } );
    }

    // Drop line segments older than pointLifetimeMS
    function expirePoints() {
        const now = Date.now();
        Object.keys(userTracks).forEach( id => {
            const track = userTracks[id];
            let expired = false;
            while (track.points.length && track.points[0].expires <= now) {
                track.points.shift();
                expired = true;
            }
            if (!expired) return;
            rebuildPaths(track);
            dirty = true;
        } );
    }

    function render() {
        requestAnimationFrame(render);
        publishPendingPoint();
        expirePoints();

        if (!dirty) return;
        dirty = false;

        context.clearRect(0, 0, screenWidth, screenHeight);

        context.lineWidth = 3;
        context.lineJoin = 'round';
        context.lineCap = 'round';

        Object.keys(userTracks).forEach( id => {
            const paths = userTracks[id].paths;
            for (let index = 0; index < paths.length; index++) {
                context.strokeStyle = paths[index].style;
                context.stroke(paths[index].path);
            }
        } );
    }
    requestAnimationFrame(render);

    // For Web Manifest
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
})();</script>
