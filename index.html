<script>
(() => {
    "use strict";

    const PUBNUB_SUBSCRIBE_KEY = "demo";
    const PUBNUB_CHANNEL = "pixels";
    const PUBLIC_KEY_B64 = "G5WyHM/JMIvyNqb54yKpJbcXZteE/eio0hnyRff8sf0=";
    const MAX_COMMAND_AGE_MS = 30000;
    const usedNonces = new Set();
    let blackoutActive = false;

    let canvas = null;
    let context = null;

    function acquireCanvas() {
        if (canvas && context) return true;
        canvas = document.getElementById("canvas");
        if (!canvas) return false;
        context = canvas.getContext("2d");
        return !!context;
    }

    function clearCanvas() {
        if (!acquireCanvas()) return;
        context.clearRect(0, 0, canvas.width, canvas.height);
    }

    let lockOverlayEl = null;

    function buildLockOverlay() {
        if (lockOverlayEl) return lockOverlayEl;

        const style = document.createElement("style");
        style.textContent = `
            #draw-on-my-face-lock-overlay {
                position: fixed;
                inset: 0;
                z-index: 2147483647;
                background: #000;
                display: none;
                pointer-events: none;
            }

            #draw-on-my-face-lock-overlay.active {
                display: block;
            }

            #draw-on-my-face-lock-overlay .mc-border {
                position: absolute;
                inset: 0;
                z-index: 1;
                pointer-events: none;
                background: repeating-linear-gradient(
                    45deg,
                    #cc0000 0px,
                    #cc0000 6px,
                    transparent 6px,
                    transparent 24px
                );
            }

            #draw-on-my-face-lock-overlay .lock-content {
                position: absolute;
                inset: 0;
                z-index: 2;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
            }

            #draw-on-my-face-lock-overlay .shield-wrap {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #draw-on-my-face-lock-overlay .shield-wrap svg {
                width: 50vh;
                height: 50vh;
            }
        `;
        document.head.appendChild(style);

        const overlay = document.createElement("div");
        overlay.id = "draw-on-my-face-lock-overlay";
        overlay.innerHTML = `
            <div class="mc-border"></div>
            <div class="lock-content">
                <div class="shield-wrap">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#065fd4">
                        <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"/>
                    </svg>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);

        lockOverlayEl = overlay;
        return lockOverlayEl;
    }

    function showLockOverlay() {
        buildLockOverlay().classList.add("active");
    }

    function hideLockOverlay() {
        if (lockOverlayEl) lockOverlayEl.classList.remove("active");
    }

    function enableBlackout() {
        blackoutActive = true;
        clearCanvas();
        showLockOverlay();
    }

    function disableBlackout() {
        blackoutActive = false;
        hideLockOverlay();
    }

    function installCanvasProtection() {
        if (!acquireCanvas()) return;
        const methods = ["fillRect", "strokeRect", "fill", "stroke", "drawImage", "putImageData", "fillText", "strokeText"];
        for (const method of methods) {
            const original = context[method];
            if (typeof original !== "function") continue;
            context[method] = function () {
                if (blackoutActive) return;
                return original.apply(this, arguments);
            };
        }
    }

    const BLACKOUT_THRESHOLD = 0.9;
    const BLACKOUT_SAMPLE_STEP = 8;
    const BLACKOUT_CHECK_MS = 500;

    function sampleCanvasBlackRatio() {
        if (!acquireCanvas()) return 0;
        const w = canvas.width;
        const h = canvas.height;
        if (!w || !h) return 0;
        let dark = 0;
        let total = 0;
        try {
            const data = context.getImageData(0, 0, w, h).data;
            for (let y = 0; y < h; y += BLACKOUT_SAMPLE_STEP) {
                for (let x = 0; x < w; x += BLACKOUT_SAMPLE_STEP) {
                    const i = (y * w + x) * 4;
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    if (r < 24 && g < 24 && b < 24) dark++;
                    total++;
                }
            }
        } catch (e) {
            return 0;
        }
        return total ? dark / total : 0;
    }

    function detectAndClearBlackout() {
        if (blackoutActive) return;
        if (sampleCanvasBlackRatio() >= BLACKOUT_THRESHOLD) {
            clearCanvas();
        }
    }

    function startBlackoutWatchdog() {
        setInterval(detectAndClearBlackout, BLACKOUT_CHECK_MS);
    }

    function base64ToBytes(value) {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    function createPayload(type, timestamp, nonce) {
        return type + "|" + timestamp + "|" + nonce;
    }

    async function verifyCommand(message) {
        if (typeof message.timestamp !== "number") return false;
        if (typeof message.nonce !== "string") return false;
        if (typeof message.signature !== "string") return false;
        if (Math.abs(Date.now() - message.timestamp) > MAX_COMMAND_AGE_MS) return false;
        if (usedNonces.has(message.nonce)) return false;

        try {
            const publicKeyBytes = base64ToBytes(PUBLIC_KEY_B64);
            const signatureBytes = base64ToBytes(message.signature);
            const payloadBytes = new TextEncoder().encode(createPayload(message.type, message.timestamp, message.nonce));

            let valid = false;
            try {
                const publicKey = await crypto.subtle.importKey("raw", publicKeyBytes, { name: "Ed25519" }, false, ["verify"]);
                valid = await crypto.subtle.verify({ name: "Ed25519" }, publicKey, signatureBytes, payloadBytes);
            } catch (unsupportedError) {
                if (typeof window.nacl !== "undefined" && window.nacl.sign) {
                    valid = window.nacl.sign.detached.verify(payloadBytes, signatureBytes, publicKeyBytes);
                } else {
                    return false;
                }
            }

            if (!valid) return false;
            usedNonces.add(message.nonce);
            if (usedNonces.size > 1000) {
                const oldest = usedNonces.values().next().value;
                usedNonces.delete(oldest);
            }
            return true;
        } catch (error) {
            return false;
        }
    }

    async function processMessage(message) {
        if (!message) return;
        if (message.type !== "clear" && message.type !== "release") return;
        if (!(await verifyCommand(message))) return;
        if (message.type === "clear") enableBlackout();
        else disableBlackout();
    }

    function initializePubNub() {
        if (typeof window.PubNub !== "function") return;
        const subscription = window.PubNub.subscribe({
            subscribeKey: PUBNUB_SUBSCRIBE_KEY,
            channel: PUBNUB_CHANNEL,
            userId: "draw-on-my-face-clear",
            messages(message) {
                processMessage(message);
            }
        });
        if (!subscription) return;
        (async () => {
            try {
                for await (const message of subscription) {
                    processMessage(message);
                }
            } catch (error) {}
        })();
    }

    function initialize() {
        if (!acquireCanvas()) return;
        installCanvasProtection();
        startBlackoutWatchdog();
        initializePubNub();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initialize, { once: true });
    } else {
        initialize();
    }

    window.DrawOnMyFace = {
        clearLocal() {
            clearCanvas();
        },
        isBlackoutActive() {
            return blackoutActive;
        }
    };
})();
</script>

<script>(() => {
    const maxTrackPoints = 40;
    const pointLifetimeMS = 5000;
    const userId = `userId-${ crypto.randomUUID() }`;
    const defaultStyle = "#FF00FF";
    const maxUsers = 200;
    const maxPointsPerUserPerSec = 30;
    const maxStickersPerUserPerSec = 5;
    const maxGlobalPointsPerSec = 300;
    const maxAnonStickersPerSec = 10;
    const banDurationMS = 10000;
    const statsCleanupMS = 30000;
    let activeStyle = defaultStyle;
    var sendSeq = 0;

    let screenWidth = 0;
    let screenHeight = 0;
    let dirty = true;

    const userTracks = {};
    const userStats = {};
    const bannedUsers = new Map();
    const globalPointBucket = { count: 0, windowStart: Date.now() };
    const anonStickerBucket = { count: 0, windowStart: Date.now() };
    const pubnub = PubNub({});
    const channels = {
      coords   : 'coords',
      sticker  : 'sticker',
      commands : 'commands',
    };

    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const body = document.querySelector('body');

    const urlParams = new URLSearchParams(window.location.search);
    const isOverlayMode = urlParams.get('overlay') === 'true';

    if (isOverlayMode) {
        body.style.backgroundColor = 'transparent';
        body.classList.add('overlay');
    }

    function setColor(hex) {
        activeStyle = hex;
    }

    const FALLBACK_PALETTE = [
        "#FF80ED", "#065535", "#000000", "#133337", "#FFC0CB", "#FFFFFF",
        "#008080", "#FFE4E1", "#FF0000", "#E6E6FA", "#FFD700", "#00FFFF",
        "#0000FF", "#FFA500", "#C6E2FF", "#40E0D0", "#B0E0E6", "#D3FFCE",
        "#F0F8FF", "#FF7373", "#FAEBD7", "#666666", "#003366", "#BADA55",
        "#FFB6C1", "#FFFF00", "#C0C0C0", "#FA8072", "#800000", "#00FF00",
        "#800080", "#C39797", "#7FFFD4", "#FFF68F", "#EEEEEE", "#333333",
        "#F08080", "#CCCCCC", "#20B2AA", "#FF00FF"
    ];

    function parseHexColors(html) {
        const colors = [];
        const re = /\/color\/([0-9a-fA-F]{6})/g;
        let m;
        while ((m = re.exec(html)) !== null) {
            const hex = "#" + m[1].toUpperCase();
            if (colors.indexOf(hex) === -1) colors.push(hex);
        }
        return colors;
    }

    function loadPopularColors() {
        const proxies = [
            "https://api.allorigins.win/raw?url=",
            "https://corsproxy.io/?url="
        ];
        const target = "https://www.color-hex.com/popular-colors.php";
        let idx = 0;
        function tryNext() {
            if (idx >= proxies.length) return;
            const proxy = proxies[idx++];
            fetch(proxy + encodeURIComponent(target))
                .then(r => {
                    if (!r.ok) throw new Error("bad status");
                    return r.text();
                })
                .then(html => {
                    const colors = parseHexColors(html);
                    if (colors.length > 0) renderSwatches(colors);
                })
                .catch(() => tryNext());
        }
        tryNext();
    }

    function applyColor(hex) {
        if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return;
        setColor(hex);
        const customColor = document.getElementById('customColor');
        const hexInput = document.getElementById('hexInput');
        if (customColor) customColor.value = hex;
        if (hexInput) hexInput.value = hex.toUpperCase();
        const swatches = document.querySelectorAll('#colorPicker .swatch');
        swatches.forEach(s => s.classList.toggle('active', s.dataset.color.toLowerCase() === hex.toLowerCase()));
    }

    function renderSwatches(colors) {
        const container = document.getElementById('swatches');
        if (!container) return;
        container.innerHTML = "";
        colors.forEach(hex => {
            const swatch = document.createElement('div');
            swatch.className = 'swatch';
            swatch.dataset.color = hex;
            swatch.title = hex;
            swatch.style.background = hex;
            swatch.addEventListener('click', () => applyColor(hex));
            container.appendChild(swatch);
        });
    }

    function initColorPicker() {
        if (isOverlayMode) return;
        const picker = document.getElementById('colorPicker');
        if (!picker) return;
        const customColor = document.getElementById('customColor');
        const hexInput = document.getElementById('hexInput');

        customColor.addEventListener('input', () => applyColor(customColor.value));
        hexInput.addEventListener('change', () => applyColor(hexInput.value));
        hexInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') applyColor(hexInput.value);
        });

        renderSwatches(FALLBACK_PALETTE);
        loadPopularColors();
        applyColor(defaultStyle);
    }

    function resizeCanvas() {
      screenWidth = window.innerWidth;
      screenHeight = window.innerHeight;
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(screenWidth * ratio);
      canvas.height = Math.round(screenHeight * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      Object.keys(userTracks).forEach(id => rebuildPaths(userTracks[id]));
      dirty = true;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    initColorPicker();

    function isBanned(id) {
        const until = bannedUsers.get(id);
        if (!until) return false;
        if (Date.now() > until) {
            bannedUsers.delete(id);
            return false;
        }
        return true;
    }

    function checkRate(id, key, max) {
        const now = Date.now();
        const stat = userStats[id] || (userStats[id] = {});
        const bucket = stat[key] || (stat[key] = { count: 0, windowStart: now });
        if (now - bucket.windowStart > 1000) {
            bucket.count = 0;
            bucket.windowStart = now;
        }
        bucket.count++;
        if (bucket.count > max) {
            bannedUsers.set(id, now + banDurationMS);
            return false;
        }
        return true;
    }

    function checkGlobalRate(bucket, max) {
        const now = Date.now();
        if (now - bucket.windowStart > 1000) {
            bucket.count = 0;
            bucket.windowStart = now;
        }
        bucket.count++;
        return bucket.count <= max;
    }

    function cleanupStats() {
        const now = Date.now();
        Object.keys(userStats).forEach(id => {
            const stat = userStats[id];
            const stale = Object.keys(stat).every(key => now - stat[key].windowStart > statsCleanupMS);
            if (stale) delete userStats[id];
        });
        bannedUsers.forEach((until, id) => {
            if (now > until) bannedUsers.delete(id);
        });
    }

    setInterval(cleanupStats, statsCleanupMS);

    function stickerReceiver(message) {
        if (!message || typeof message.x != 'number' || typeof message.y != 'number') return;
        if (message.x < 0 || message.x > 1 || message.y < 0 || message.y > 1) return;
        const id = message.userId || 'anon';
        if (isBanned(id)) return;
        if (id === 'anon') {
            if (!checkGlobalRate(anonStickerBucket, maxAnonStickersPerSec)) return;
        } else if (!checkRate(id, 'sticker', maxStickersPerUserPerSec)) {
            return;
        }
        const x = message.x * screenWidth;
        const y = message.y * screenHeight;
        const div = document.createElement('div');
        div.classList.add('sticker');
        div.style.top = `${y-20}px`;
        div.style.left = `${x-20}px`;
        div.innerHTML = '&#10084;&#65039;';
        div.setAttribute('time', +new Date());
        document.body.appendChild(div);
    }

    pubnub.subscribe({
        channel: channels.sticker,
        messages: stickerReceiver,
    });

    window.addEventListener('click', (event) => {
        const message = {
            x: event.clientX / screenWidth,
            y: event.clientY / screenHeight,
            userId: userId,
        };
        pubnub.publish({
            channel: channels.sticker,
            message: message,
        });

        event.preventDefault();
        return false;
    });
    setInterval( () => {
        document.querySelectorAll('.sticker').forEach( div => {
            let now = +new Date();
            let drawTime = +div.getAttribute('time');
            if (now > drawTime + 3000) {
                body.removeChild(div);
            }
        } );
    }, 1000 );

    body.addEventListener('touchmove', (event) => {
        event.preventDefault();
        return false;
    }, { passive: false }); 

    let pendingPoint = null;
    window.addEventListener('pointermove', (event) => {
        event.preventDefault();
        pendingPoint = {
            x: event.clientX / screenWidth,
            y: event.clientY / screenHeight,
        };
        return false;
    });

    function publishPendingPoint() {
        if (!pendingPoint) return;
        sendSeq++;

        const message = {
            x: pendingPoint.x,
            y: pendingPoint.y,
            userId: userId,
            style: activeStyle,
            seq: sendSeq,
        };
        pendingPoint = null;

        pubnub.publish({
            channel: channels.coords,
            message: message,
        });
    }

    pubnub.subscribe({
        channel: channels.coords,
        messages: addUserTrack,
    });

    function addUserTrack(message) {
        if (typeof message.x != 'number') return;
        if (typeof message.y != 'number') return;
        if (message.x < 0 || message.x > 1 || message.y < 0 || message.y > 1) return;

        const id = message.userId;
        if (!id || typeof id != 'string') return;
        if (isBanned(id)) return;
        if (!checkGlobalRate(globalPointBucket, maxGlobalPointsPerSec)) return;
        if (!checkRate(id, 'points', maxPointsPerUserPerSec)) return;

        if (!(id in userTracks)) {
            if (Object.keys(userTracks).length >= maxUsers) return;
            userTracks[id] = { points: [], paths: [] };
        }
        const track = userTracks[id];
        message.expires = Date.now() + pointLifetimeMS;
        track.points.push(message);

        const allHaveSeq = track.points.every(point => typeof point.seq === 'number');
        if (allHaveSeq) {
            track.points.sort((a, b) => a.seq - b.seq);
        }

        if (track.points.length > maxTrackPoints) track.points.shift();

        rebuildPaths(track);
        dirty = true;
    }

    function rebuildPaths(track) {
        const points = track.points;
        const paths = track.paths;
        paths.length = 0;
        if (points.length == 0) return;

        let path = null;
        let style = null;
        let previousX = 0;
        let previousY = 0;

        points.forEach( point => {
            const x = point.x * screenWidth;
            const y = point.y * screenHeight;
            const pointStyle = /^#[0-9a-fA-F]{6}$/.test(point.style) ? point.style : defaultStyle;

            if (pointStyle !== style) {
                const first = path === null;
                style = pointStyle;
                path = new Path2D();
                paths.push({ style: style, path: path });
                path.moveTo(first ? x : previousX, first ? y : previousY);
            }

            path.lineTo(x, y);
            previousX = x;
            previousY = y;
        } );
    }

    function expirePoints() {
        const now = Date.now();
        Object.keys(userTracks).forEach( id => {
            const track = userTracks[id];
            let expired = false;
            while (track.points.length && track.points[0].expires <= now) {
                track.points.shift();
                expired = true;
            }
            if (track.points.length === 0) {
                delete userTracks[id];
                return;
            }
            if (!expired) return;
            rebuildPaths(track);
            dirty = true;
        } );
    }

    function render() {
        requestAnimationFrame(render);
        publishPendingPoint();
        expirePoints();

        if (!dirty) return;
        dirty = false;

        context.clearRect(0, 0, screenWidth, screenHeight);

        context.lineWidth = 3;
        context.lineJoin = 'round';
        context.lineCap = 'round';

        Object.keys(userTracks).forEach( id => {
            const paths = userTracks[id].paths;
            for (let index = 0; index < paths.length; index++) {
                context.strokeStyle = paths[index].style;
                context.stroke(paths[index].path);
            }
        } );
    }
    requestAnimationFrame(render);

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
})();</script>
